name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # --ignore-scripts avoids downloading native binaries (sharp/libvips) in CI
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Typecheck (npm run lint)
        run: npm run lint

      - name: Build (vite + esbuild)
        run: npm run build

      - name: Tests (node:test)
        run: npm test
        env:
          CODGAR_DEMO_MODE: ''

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: ignore
          retention-days: 3
