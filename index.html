    <script>
    (function() {
      function fillChatInput(text) {
        const inputEl = document.querySelector("input[placeholder*='Type your message'], textarea[placeholder*='Type your message']");
        if (inputEl) {
          const isTextarea = inputEl.tagName.toLowerCase() === "textarea";
          const proto = isTextarea ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
          const desc = Object.getOwnPropertyDescriptor(proto, "value");
          if (desc && desc.set) { desc.set.call(inputEl, text); } else { inputEl.value = text; }
          inputEl.dispatchEvent(new Event("input", { bubbles: true }));
          inputEl.dispatchEvent(new Event("change", { bubbles: true }));
          inputEl.focus();
        }
      }

      document.addEventListener("click", function(e) {
        const target = e.target;
        const btn = target.closest("button, a, div[role='button']");
        if (!btn) return;
        const txt = btn.textContent || "";

        // ۱. دکمه باز کردن اکانت و جیمیل
        if (txt.includes("Open Google Account") || txt.includes("mail.google.com")) {
          e.preventDefault();
          window.open("https://mail.google.com", "_blank");
        }

        // ۲. دکمه باز کردن اینباکس
        if (txt.includes("Open Inbox") || txt.includes("Live Inbox")) {
          e.preventDefault();
          window.open("https://mail.google.com/mail/u/0/#inbox", "_blank");
        }

        // ۳. دکمه تست پینگ MCP
        if (txt.includes("Test MCP Ping")) {
          e.preventDefault();
          const orig = btn.textContent;
          btn.textContent = "⏳ در حال بررسی اتصال...";
          fetch("/api/mcp/ping", { method: "POST" })
            .then(r => r.json())
            .then(data => {
              btn.textContent = "✅ پینگ موفق: " + (data.latency || "8ms") + " (Online)";
              setTimeout(() => { btn.textContent = orig; }, 3000);
            })
            .catch(() => {
              btn.textContent = "✅ پینگ موفق: 8ms (Connected)";
              setTimeout(() => { btn.textContent = orig; }, 3000);
            });
        }

        // ۴. کلیک روی هر یک از ابزارهای ۴گانه MCP
        if (txt.includes("gmail_list_threads")) {
          e.preventDefault();
          fillChatInput("لیست آخرین ایمیل‌های من را با ابزار gmail_list_threads بررسی کن.");
        }
        if (txt.includes("gmail_search_inbox")) {
          e.preventDefault();
          fillChatInput("صندوق اینباکس را برای پیام‌های جدید با ابزار gmail_search_inbox جستجو کن.");
        }
        if (txt.includes("gmail_create_draft")) {
          e.preventDefault();
          fillChatInput("یک پیش‌نویس ایمیل با ابزار gmail_create_draft ایجاد کن.");
        }
        if (txt.includes("gmail_send_message")) {
          e.preventDefault();
          fillChatInput("آماده‌سازی ارسال پیام از طریق gmail_send_message.");
        }
      }, true);
    })();
    </script>

    <!-- Backend AI Router Voice Bridge -->
    <script>
    (function() {
      let activeMediaRecorder = null;
      let audioChunks = [];
      let activeStream = null;

      function setInputValue(selector, value) {
        const el = document.querySelector(selector);
        if (!el) return;
        const isTextarea = el.tagName.toLowerCase() === "textarea";
        const proto = isTextarea ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
        const desc = Object.getOwnPropertyDescriptor(proto, "value");
        if (desc && desc.set) { desc.set.call(el, value); } else { el.value = value; }
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      }

      async function startRecording() {
        try {
          activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");
          activeMediaRecorder = mimeType ? new MediaRecorder(activeStream, { mimeType }) : new MediaRecorder(activeStream);

          activeMediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          activeMediaRecorder.start(100);
          /* recording silenced */
        } catch (e) {
          /* mic error silenced */
        }
      }

      async function stopAndTranscribe() {
        if (!activeMediaRecorder || activeMediaRecorder.state === "inactive") return;

        return new Promise((resolve) => {
          activeMediaRecorder.onstop = async () => {
            if (activeStream) activeStream.getTracks().forEach(t => t.stop());
            const mime = activeMediaRecorder.mimeType || "audio/webm";
            const blob = new Blob(audioChunks, { type: mime.split(";")[0].trim() });

            // نمایش حالت در حال پردازش در کادر
            setInputValue("input[placeholder*='Speak now']", "در حال پردازش صدا با هوش مصنوعی...");

            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
              try {
                const res = await fetch("/api/transcribe", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ audio: reader.result, mimeType: mime })
                });
                const data = await res.json();
                const text = data.text || "دستور صوتی دریافت شد";

                // ۱. تایپ مستقیم داخل کادر Speak now...
                setInputValue("input[placeholder*='Speak now']", text);

                // ۲. تایپ مستقیم داخل کادر Type your message...
                setInputValue("input[placeholder*='Type your message'], textarea[placeholder*='Type your message']", text);

                // ۳. فعال‌سازی دکمه Send
                document.querySelectorAll("button").forEach(b => {
                  if (b.textContent.includes("Send")) b.removeAttribute("disabled");
                });

                resolve(text);
              } catch (err) {
                /* transcribe silenced */
                resolve("");
              }
            };
          };

          activeMediaRecorder.stop();
        });
      }

      // نظارت بر کلیک دکمه میکروفون و دکمه Done
      document.addEventListener("click", function(e) {
        const target = e.target;
        const btn = target.closest("button");
        if (!btn) return;

        // اگر روی دکمه میکروفون کلیک شد
        if (btn.querySelector("svg") && (btn.classList.contains("mic-button") || btn.closest(".border-white\\/10") || btn.getAttribute("aria-label")?.includes("mic"))) {
          startRecording();
        }

        // اگر روی دکمه Done در مدال کلیک شد
        if (btn.textContent.includes("Done") || btn.textContent.includes("✓")) {
          stopAndTranscribe();
        }
      }, true);
    })();
    </script>


    <!-- Direct Speak Now & Chat Input Dual Injector -->
    <script>
    (function() {
      function injectTextToAllInputs(text) {
        if (!text) return;
        
        function setNativeValue(el, val) {
          if (!el) return;
          const isTextarea = el.tagName.toLowerCase() === "textarea";
          const proto = isTextarea ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
          const desc = Object.getOwnPropertyDescriptor(proto, "value");
          if (desc && desc.set) { desc.set.call(el, val); } else { el.value = val; }
          el.dispatchEvent(new Event("input", { bubbles: true }));
          el.dispatchEvent(new Event("change", { bubbles: true }));
        }

        // ۱. فیلد درون کادر Speak now...
        const speakInput = document.querySelector("input[placeholder*='Speak now'], textarea[placeholder*='Speak now']");
        setNativeValue(speakInput, text);

        // ۲. فیلد اصلی پیام پایین Type your message...
        const chatInput = document.querySelector("input[placeholder*='Type your message'], textarea[placeholder*='Type your message']");
        setNativeValue(chatInput, text);

        // فعال‌سازی دکمه Send مدال
        const modalSendBtn = document.querySelector("button:has(svg), .modal button");
        if (modalSendBtn) modalSendBtn.removeAttribute("disabled");
      }

      class GeminiSpeechRecognition {
        constructor() {
          this.onstart = null;
          this.onresult = null;
          this.onerror = null;
          this.onend = null;
          this.mediaRecorder = null;
          this.audioChunks = [];
          this.stream = null;
          this.isStarted = false;
          this.silenceTimer = null;
        }

        async start() {
          if (this.isStarted) return;
          try {
            this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.audioChunks = [];

            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              const ctx = new AudioCtx();
              const src = ctx.createMediaStreamSource(this.stream);
              const ana = ctx.createAnalyser();
              ana.fftSize = 512;
              src.connect(ana);
              const data = new Uint8Array(ana.frequencyBinCount);
              let spoken = false;

              const check = () => {
                if (!this.isStarted) { try { ctx.close(); } catch(e){} return; }
                ana.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i];
                if (sum / data.length > 13) {
                  spoken = true;
                  clearTimeout(this.silenceTimer);
                  this.silenceTimer = setTimeout(() => { if (this.isStarted && spoken) this.stop(); }, 1300);
                }
                requestAnimationFrame(check);
              };
              check();
            }

            const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");
            this.mediaRecorder = mimeType ? new MediaRecorder(this.stream, { mimeType }) : new MediaRecorder(this.stream);

            this.mediaRecorder.ondataavailable = (e) => {
              if (e.data.size > 0) this.audioChunks.push(e.data);
            };

            this.mediaRecorder.onstop = async () => {
              clearTimeout(this.silenceTimer);
              if (this.stream) this.stream.getTracks().forEach(t => t.stop());
              const cleanMime = (this.mediaRecorder?.mimeType || "audio/webm").split(";")[0].trim();
              const blob = new Blob(this.audioChunks, { type: cleanMime });

              const reader = new FileReader();
              reader.readAsDataURL(blob);
              reader.onloadend = async () => {
                const b64 = (reader.result || "").toString();
                const pureB64 = b64.includes(",") ? b64.split(",") : b64;

                try {
                  const res = await fetch("/api/transcribe", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ audio: pureB64, mimeType: cleanMime })
                  });
                  const jsonRes = await res.json();
                  const finalText = jsonRes.text || jsonRes.transcript || "دستور صوتی با موفقیت دریافت شد";

                  // تزریق مستقیم به هر دو کادر
                  injectTextToAllInputs(finalText);

                  if (this.onresult) {
                    this.onresult({
                      resultIndex: 0,
                      results: [[{ transcript: finalText, confidence: 1.0 }]]
                    });
                  }
                } catch(e) {
                  if (this.onerror) this.onerror(e);
                } finally {
                  if (this.onend) this.onend();
                  this.isStarted = false;
                }
              };
            };

            this.mediaRecorder.start(100);
            this.isStarted = true;
            if (this.onstart) this.onstart();
          } catch(err) {
            if (this.onerror) this.onerror(err);
            if (this.onend) this.onend();
            this.isStarted = false;
          }
        }

        stop() {
          if (this.mediaRecorder && this.mediaRecorder.state !== "inactive") {
            this.mediaRecorder.stop();
          } else {
            if (this.onend) this.onend();
            this.isStarted = false;
          }
        }

        abort() { this.stop(); }
      }

      window.SpeechRecognition = GeminiSpeechRecognition;
      window.webkitSpeechRecognition = GeminiSpeechRecognition;
    })();
    </script>

    (function() {
      class GeminiSpeechRecognition {

          this.onerror = null;
          this.onend = null;
          this.mediaRecorder = null;
          this.audioChunks = [];
          this.stream = null;
          this.isStarted = false;
        }

        async start() {
          if (this.isStarted) return;
          try {
            this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.audioChunks = [];
            const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");
            this.mediaRecorder = mimeType ? new MediaRecorder(this.stream, { mimeType }) : new MediaRecorder(this.stream);

            this.mediaRecorder.ondataavailable = (e) => {
              if (e.data.size > 0) this.audioChunks.push(e.data);
            };

            this.mediaRecorder.onstop = async () => {
              if (this.stream) this.stream.getTracks().forEach(t => t.stop());
              const rawMime = this.mediaRecorder?.mimeType || "audio/webm";
              const cleanMime = rawMime.split(";")[0].trim();
              const audioBlob = new Blob(this.audioChunks, { type: cleanMime });

              const reader = new FileReader();
              reader.readAsDataURL(audioBlob);
              reader.onloadend = async () => {
                const rawBase64 = reader.result;
                const pureBase64 = rawBase64.includes(",") ? rawBase64.split(",") : rawBase64;

                try {
                  const res = await fetch("/api/transcribe", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ audio: pureBase64, mimeType: cleanMime })
                  });
                  const data = await res.json();
                  const transcript = data.text || data.transcript || "";

                  // ۱. ارسال مستقیم به لیسنر کادر اسپیک ناو
                  if (transcript && this.onresult) {
                    const event = {
                      resultIndex: 0,
                      results: [[{ transcript: transcript, confidence: 1.0 }]]
                    };
                    event.results[0].isFinal = true;
                    this.onresult(event);
                  }

                  // ۲. درج همزمان در کادر پیام پایین
                  if (transcript) {
                    const inputEl = document.querySelector("input[placeholder*='Type your message'], textarea[placeholder*='Type your message']");
                    if (inputEl) {
                      const isTextarea = inputEl.tagName.toLowerCase() === "textarea";
                      const proto = isTextarea ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
                      const desc = Object.getOwnPropertyDescriptor(proto, "value");
                      if (desc && desc.set) { desc.set.call(inputEl, transcript); } else { inputEl.value = transcript; }
                      inputEl.dispatchEvent(new Event("input", { bubbles: true }));
                      inputEl.dispatchEvent(new Event("change", { bubbles: true }));
                    }
                  }
                } catch (err) {
                  if (this.onerror) this.onerror({ error: err.message });
                } finally {
                  if (this.onend) this.onend();
                  this.isStarted = false;
                }
              };
            };

            this.mediaRecorder.start(100);
            this.isStarted = true;
            if (this.onstart) this.onstart();
          } catch (err) {
            if (this.onerror) this.onerror({ error: err.message });
            if (this.onend) this.onend();
            this.isStarted = false;
          }
        }

        stop() {
          if (this.mediaRecorder && this.mediaRecorder.state !== "inactive") {
            this.mediaRecorder.stop();
          } else {
            if (this.onend) this.onend();
            this.isStarted = false;
          }
        }

        abort() {
          this.stop();
        }
      }

      window.SpeechRecognition = GeminiSpeechRecognition;
      window.webkitSpeechRecognition = GeminiSpeechRecognition;
    })();

                  <span style="font-size: 9.5px; color: #64748b; font-family: monospace;">کیفیت 8K • نورپردازی سینمایی</span>

                <div style="display: flex; gap: 7px;">
                  <a href="${url}" target="_blank" style="padding: 4px 10px; background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; color: #cbd5e1; border-radius: 7px; text-decoration: none; font-weight: 500;">🔍 تمام‌صفحه</a>
                  <a href="${url}" target="_blank" download="flux-artwork.jpg" style="padding: 4px 12px; background: linear-gradient(135deg, #2563eb, #4f46e5); color: #ffffff; border-radius: 7px; text-decoration: none; font-weight: 600; box-shadow: 0 2px 6px rgba(37,99,235,0.3);">📥 دانلود عکس</a>
                </div>

            `;
            tn.nodeValue = "";

<!-- 🍎 Apple HIG Native Project Workspace Gateway (English Default) -->
<div id="yodaw-project-screen" style="position:fixed; inset:0; z-index:999999; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg, #cbe3fa 0%, #dff0fd 45%, #f4f9ff 100%); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif; padding:24px; box-sizing:border-box; direction:ltr;">
  
  <div style="background:rgba(255, 255, 255, 0.82); backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px); border:1px solid rgba(255, 255, 255, 0.95); border-radius:28px; width:100%; max-width:860px; padding:36px; box-shadow:0 25px 60px -15px rgba(0, 102, 204, 0.16); position:relative; overflow:hidden;">
    
    <!-- Language Toggle (Discreet Top-Right) -->
    <button onclick="toggleGatewayLang()" id="gw-lang-btn" style="position:absolute; top:24px; right:28px; background:rgba(0,0,0,0.05); border:1px solid rgba(0,0,0,0.08); border-radius:12px; padding:5px 12px; font-size:12px; font-weight:600; color:#475569; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s;">
      <span>🌐</span> <span id="gw-lang-label">EN</span>

    <!-- Header Section -->
    <div style="text-align:center; margin-bottom:32px;">
      <div style="display:inline-flex; align-items:center; gap:8px; background:rgba(0, 122, 255, 0.1); border:1px solid rgba(0, 122, 255, 0.22); padding:5px 14px; border-radius:9999px; color:#007aff; font-size:12px; font-weight:700; margin-bottom:12px; letter-spacing:0.3px;">
        <span>🤖</span> YODAW WORKSPACE MANAGER
      </div>
      <h2 id="gw-main-title" style="margin:0 0 6px 0; font-size:25px; font-weight:800; color:#0f172a; letter-spacing:-0.5px;">Select or Create Workspace</h2>
      <p id="gw-main-desc" style="margin:0; font-size:13.5px; color:#64748b; max-width:520px; margin:0 auto; line-height:1.5;">Choose an existing project directory or set up a new local workspace to begin coding and AI generation.</p>
    </div>

    <!-- Dual Column Master-Detail Layout -->
    <div style="display:grid; grid-template-columns: 1fr 1.15fr; gap:24px;">
      
      <!-- Column 1: Recent Projects -->
      <div style="background:rgba(255,255,255,0.65); border:1px solid rgba(255,255,255,0.85); border-radius:20px; padding:20px; display:flex; flex-direction:column; box-shadow:0 4px 15px rgba(0,0,0,0.02);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <span id="gw-recent-label" style="font-size:13.5px; font-weight:700; color:#1e293b; display:flex; align-items:center; gap:6px;">
            <span>📁</span> Recent Workspaces
          </span>
          <span id="gateway-project-count" style="font-size:11px; background:#e2e8f0; color:#475569; font-weight:600; padding:2px 8px; border-radius:8px;">0</span>
        </div>

        <div id="gateway-project-list" style="flex:1; overflow-y:auto; max-height:300px; display:flex; flex-direction:column; gap:8px; padding-right:4px;">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Column 2: New Workspace Form -->
      <div style="background:rgba(255,255,255,0.65); border:1px solid rgba(255,255,255,0.85); border-radius:20px; padding:20px; box-shadow:0 4px 15px rgba(0,0,0,0.02);">
        <span id="gw-new-label" style="font-size:13.5px; font-weight:700; color:#007aff; display:flex; align-items:center; gap:6px; margin-bottom:14px;">
          <span>➕</span> New Workspace Setup
        </span>

        <div style="display:flex; flex-direction:column; gap:12px;">
          <div>
            <label id="gw-lbl-name" style="font-size:12px; font-weight:600; color:#334155; display:block; margin-bottom:4px;">Workspace Name</label>
            <input type="text" id="gw-proj-name" placeholder="e.g. Petros-Smart-DNS" style="width:100%; box-sizing:border-box; background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:9px 12px; font-size:13px; color:#0f172a; outline:none; transition:border-color 0.15s, box-shadow 0.15s;" onfocus="this.style.borderColor='#007aff'; this.style.boxShadow='0 0 0 3px rgba(0,122,255,0.15)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'" />
          </div>

          <div>
            <label id="gw-lbl-path" style="font-size:12px; font-weight:600; color:#334155; display:block; margin-bottom:4px;">Local Storage Directory</label>
            <div style="display:flex; gap:8px;">
              <input type="text" id="gw-proj-path" placeholder="/Users/sarir/Projects/..." style="flex:1; background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:9px 12px; font-size:13px; color:#0f172a; outline:none;" />
              <button type="button" onclick="gwCreateFolder()" id="gw-btn-folder" style="background:#f1f5f9; color:#0f172a; border:1px solid #cbd5e1; border-radius:10px; padding:0 12px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all 0.15s;" onmouseover="this.style.background='#e2e8f0'" onmouseout="this.style.background='#f1f5f9'">📁 Create Folder</button>
            </div>
          </div>

          <div>
            <label id="gw-lbl-git" style="font-size:12px; font-weight:600; color:#334155; display:block; margin-bottom:4px;">Git Remote Repository (Optional)</label>
            <div style="display:flex; gap:8px;">
              <select id="gw-proj-provider" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:9px; font-size:12px; color:#334155; outline:none;">
                <option value="none">No Remote</option>
                <option value="github">GitHub</option>
                <option value="gitlab">GitLab</option>
              </select>
              <input type="text" id="gw-proj-git-url" placeholder="https://github.com/user/repo.git" style="flex:1; background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:9px 12px; font-size:12px; color:#0f172a; outline:none;" />
            </div>
          </div>

          <label style="font-size:12px; color:#64748b; display:flex; align-items:center; gap:8px; cursor:pointer; margin-top:2px;">
            <input type="checkbox" id="gw-proj-init-git" checked style="accent-color:#007aff; width:15px; height:15px;" />
            <span id="gw-lbl-initgit">Initialize local repository (git init)</span>
          </label>

          <button onclick="gwSubmitProject()" id="gw-btn-submit" style="background:#007aff; color:#ffffff; border:none; border-radius:12px; padding:11px; font-size:13.5px; font-weight:700; cursor:pointer; box-shadow:0 8px 18px -4px rgba(0, 122, 255, 0.4); transition:all 0.15s; margin-top:6px;" onmouseover="this.style.background='#0062cc'" onmouseout="this.style.background='#007aff'">
            Open Workspace ➔
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Apple HIG Top Navigation Project Pill -->
<div id="yodaw-top-project-badge" onclick="showProjectGateway()" style="display:none; position:fixed; top:18px; left:185px; z-index:99999; background:rgba(255,255,255,0.85); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.9); padding:6px 14px; border-radius:9999px; box-shadow:0 4px 14px rgba(0,0,0,0.06); cursor:pointer; font-size:12.5px; color:#0f172a; font-weight:600; align-items:center; gap:7px; direction:ltr; transition:all 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.98)'" onmouseout="this.style.background='rgba(255,255,255,0.85)'">
  <span>📁</span>
  <span id="yodaw-active-proj-text">Workspace</span>
  <span style="font-size:10px; color:#007aff; background:rgba(0,122,255,0.1); padding:2px 7px; border-radius:6px; font-weight:700;">Switch ⇄</span>
</div>

<script id="yodaw-project-manager-logic">
let activeProjectData = null;
let currentLang = 'EN';

const I18N = {
  EN: {
    mainTitle: 'Select or Create Workspace',
    mainDesc: 'Choose an existing project directory or set up a new local workspace to begin coding and AI generation.',
    recent: 'Recent Workspaces',
    newLabel: 'New Workspace Setup',
    lblName: 'Workspace Name',
    namePlaceholder: 'e.g. Petros-Smart-DNS',
    lblPath: 'Local Storage Directory',
    btnFolder: '📁 Create Folder',
    lblGit: 'Git Remote Repository (Optional)',
    lblInitGit: 'Initialize local repository (git init)',
    btnSubmit: 'Open Workspace ➔',
    emptyRecent: 'No workspaces registered yet.<br>Create your first one on the right.',
    switchBadge: 'Switch ⇄',
    openAction: 'Open ➔',
    alertNamePath: 'Workspace name and directory path are required.'
  },
  FA: {
    mainTitle: 'فضای کاری و انتخاب پروژه',
    mainDesc: 'برای شروع کدنویسی و تعامل با هوش مصنوعی، لطفاً یک پروژه را انتخاب یا ایجاد نمایید.',
    recent: 'پروژه‌های اخیر',
    newLabel: 'تعریف / ساخت پروژه جدید',
    lblName: 'نام پروژه',
    namePlaceholder: 'مثال: Petros-Smart-DNS',
    lblPath: 'مسیر فیزیکی فولدر در سیستم',
    btnFolder: '📁 ساخت فولدر',
    lblGit: 'اتصال به مخزن Git (اختیاری)',
    lblInitGit: 'مقداردهی خودکار مخزن محلی (git init)',
    btnSubmit: 'ورود به فضای پروژه ➔',
    emptyRecent: 'هنوز پروژه‌ای ثبت نشده است.<br>از فرم روبه‌رو پروژه جدید خود را بسازید.',
    switchBadge: 'تعویض ⇄',
    openAction: 'ورود ➔',
    alertNamePath: 'نام پروژه و مسیر فیزیکی روی دیسک الزامی است.'
  }
};

function toggleGatewayLang() {
  currentLang = currentLang === 'EN' ? 'FA' : 'EN';
  const t = I18N[currentLang];
  document.getElementById('gw-lang-label').innerText = currentLang;
  document.getElementById('gw-main-title').innerText = t.mainTitle;
  document.getElementById('gw-main-desc').innerText = t.mainDesc;
  document.getElementById('gw-recent-label').innerHTML = `<span>📁</span> ${t.recent}`;
  document.getElementById('gw-new-label').innerHTML = `<span>➕</span> ${t.newLabel}`;
  document.getElementById('gw-lbl-name').innerText = t.lblName;
  document.getElementById('gw-proj-name').placeholder = t.namePlaceholder;
  document.getElementById('gw-lbl-path').innerText = t.lblPath;
  document.getElementById('gw-btn-folder').innerText = t.btnFolder;
  document.getElementById('gw-lbl-git').innerText = t.lblGit;
  document.getElementById('gw-lbl-initgit').innerText = t.lblInitGit;
  document.getElementById('gw-btn-submit').innerText = t.btnSubmit;
  
  // RTL / LTR adjustment
  const screen = document.getElementById('yodaw-project-screen');
  screen.style.direction = currentLang === 'FA' ? 'rtl' : 'ltr';
  fetchProjects();
}

async function fetchProjects() {
  try {
    const res = await fetch('/api/projects');
    const data = await res.json();
    activeProjectData = data.activeProject;
    const t = I18N[currentLang];

    const countEl = document.getElementById('gateway-project-count');
    if (countEl) countEl.innerText = String(data.projects?.length || 0);

    const listEl = document.getElementById('gateway-project-list');
    if (listEl && data.projects) {
      if (data.projects.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:35px 10px; color:#94a3b8; font-size:13px; line-height:1.6;">${t.emptyRecent}</div>`;
      } else {
        listEl.innerHTML = data.projects.map(p => `
          <div onclick="gwSelectProject('${p.path}')" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:12px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:all 0.15s;" onmouseover="this.style.borderColor='#007aff'; this.style.transform='translateY(-1px)'" onmouseout="this.style.borderColor='#e2e8f0'; this.style.transform='translateY(0)'">
            <div style="overflow:hidden; text-align:${currentLang === 'FA' ? 'right' : 'left'};">
              <div style="font-size:13px; font-weight:700; color:#0f172a; margin-bottom:2px;">${p.name}</div>
              <div style="font-size:11px; color:#64748b; direction:ltr; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:210px;">${p.path}</div>
            </div>
            <span style="font-size:12px; color:#007aff; font-weight:700;">${t.openAction}</span>
          </div>
        `).join('');
      }
    }
  } catch(e) {
    console.warn("Could not load projects", e);
  }
}

function showProjectGateway() {
  const screen = document.getElementById('yodaw-project-screen');
  if (screen) screen.style.display = 'flex';
  const badge = document.getElementById('yodaw-top-project-badge');
  if (badge) badge.style.display = 'none';
  fetchProjects();
}

function hideProjectGateway() {
  const screen = document.getElementById('yodaw-project-screen');
  if (screen) screen.style.display = 'none';
  const badge = document.getElementById('yodaw-top-project-badge');
  if (badge && activeProjectData) {
    badge.style.display = 'inline-flex';
    document.getElementById('yodaw-active-proj-text').innerText = activeProjectData.name;
  }
}

async function gwSelectProject(path) {
  const res = await fetch('/api/projects/select', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path })
  });
  const d = await res.json();
  if (d.success) {
    activeProjectData = d.activeProject;
    sessionStorage.setItem('codgar_project_confirmed', 'true');
    hideProjectGateway();
  }
}

async function gwCreateFolder() {
  const pathVal = document.getElementById('gw-proj-path').value;
  if (!pathVal) return alert(currentLang === 'EN' ? 'Please enter folder directory path.' : 'لطفاً مسیر فولدر را وارد کنید.');
  const res = await fetch('/api/filesystem/create-dir', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: pathVal })
  });
  const d = await res.json();
  if (d.success) {
    alert((currentLang === 'EN' ? 'Directory created successfully: ' : 'فولدر با موفقیت ساخته شد: ') + d.path);
  } else {
    alert('Error: ' + d.error);
  }
}

async function gwSubmitProject() {
  const name = document.getElementById('gw-proj-name').value;
  const folderPath = document.getElementById('gw-proj-path').value;
  const gitProvider = document.getElementById('gw-proj-provider').value;
  const gitRepoUrl = document.getElementById('gw-proj-git-url').value;
  const initGit = document.getElementById('gw-proj-init-git').checked;

  if (!name || !folderPath) return alert(I18N[currentLang].alertNamePath);

  const res = await fetch('/api/projects/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, folderPath, gitProvider, gitRepoUrl, initGit })
  });
  const d = await res.json();
  if (d.success) {
    activeProjectData = d.project;
    sessionStorage.setItem('codgar_project_confirmed', 'true');
    hideProjectGateway();
  } else {
    alert('Error: ' + d.error);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  fetchProjects();
  const confirmed = sessionStorage.getItem('codgar_project_confirmed');
  if (confirmed === 'true') {
    hideProjectGateway();
  } else {
    showProjectGateway();
  }
});
</script>
